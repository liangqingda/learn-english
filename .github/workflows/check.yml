name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # runner 默认就是 UTC；显式固定，避免再次出现「本机 +08:00 能过、CI 上时间差 8 小时」的用例
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: |
          python3 -m unittest discover -s learn-from-english/tests -v
          python3 -m unittest discover -s study-notes/tests -v
      - name: Validate learning records
        run: python3 learn-from-english/scripts/learning_records.py validate
      - name: Validate review notes
        run: |
          if ls learning-record-notes/*-*.md >/dev/null 2>&1; then
            python3 study-notes/scripts/note.py check --all
          fi
      - name: Compile Python sources
        run: python3 -m compileall -q learn-from-english/scripts learn-from-english/tests study-notes/scripts study-notes/tests
