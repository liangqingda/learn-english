name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python3 -m unittest discover -s learn-from-english/tests -v
      - name: Validate learning records
        run: python3 learn-from-english/scripts/learning_records.py validate
      - name: Compile Python sources
        run: python3 -m compileall -q learn-from-english/scripts learn-from-english/tests
